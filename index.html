<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>بانک ایده‌ها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --text:#22242a; --muted:#8a8f98;
    --line:#e8e8e3; --chip:#f0f0ec; --accent:#0d9488;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:'Vazirmatn',Tahoma,sans-serif; background:var(--bg); color:var(--text); padding:0 14px 48px; min-height:100vh}

  /* نوار بالای باریک و چسبان: فقط عنوان + شمارنده + دکمهٔ فیلترها */
  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    margin:0 -14px; padding:10px 14px; border-bottom:1px solid var(--line)}
  /* انتخاب‌گر اصلی پیج: سگمنت سه‌تایی، همیشه بالای صفحه — حالت «همه» ندارد */
  .seg{display:flex; width:100%; background:var(--chip); border-radius:10px; padding:3px; gap:3px}
  .seg button{flex:1; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:13px; font-weight:500; padding:6px 4px; border-radius:8px; cursor:pointer}
  .seg button.on{background:#fff; color:var(--text); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .topbar .ttl{font-size:15px; font-weight:900; white-space:nowrap}
  .topbar .cnt{color:var(--muted); font-size:12px; white-space:nowrap}
  .topbar .cnt b{color:var(--text); font-weight:700}
  #filterToggle{margin-inline-start:auto; display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:6px 14px; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer}
  #filterToggle .fbadge{background:var(--accent); color:#fff; border-radius:999px; font-size:11px; font-weight:700; padding:0 7px; display:none}
  #filterToggle .chev{transition:transform .2s; color:var(--muted)}
  #filterToggle.open .chev{transform:rotate(180deg)}

  /* پنل فیلترها: پیش‌فرض بسته، در جریان صفحه (نه چسبان) */
  .filters{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0 2px}
  .filters[hidden]{display:none}
  .flabel{font-size:11px; color:var(--muted); margin:10px 0 6px}
  .flabel:first-child{margin-top:0}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:5px 13px; font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer}
  .chip.on{border-color:var(--accent); background:var(--accent); color:#fff; font-weight:700}
  .frow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .frow label{flex:1 1 30%; min-width:100px; font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
  .frow select,.frow input{background:#fff; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:7px; font-family:inherit; font-size:13px; width:100%}
  .frow input[type="date"]{direction:ltr; text-align:left}
  #resetBtn{margin-top:12px; width:100%; background:transparent; border:1px dashed var(--line); color:var(--muted); border-radius:10px; padding:7px; font-family:inherit; font-size:12.5px; cursor:pointer}

  section.bucket{margin-top:22px}
  .buckethead{display:flex; align-items:baseline; gap:8px; margin-bottom:2px}
  .buckethead h2{margin:0; font-size:16px; font-weight:900}
  .buckethead .n{color:var(--muted); font-size:12px; font-weight:400}
  .blurb{color:var(--muted); font-size:12px; margin:1px 0 10px; line-height:1.8}

  .grid{display:grid; grid-template-columns:1fr; gap:10px}
  @media (min-width:720px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:1080px){ .grid{grid-template-columns:repeat(3,1fr)} }

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column}
  .card .row1{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .code{background:var(--chip); color:var(--muted); font-weight:700; font-size:11.5px; border-radius:6px; padding:1px 7px}
  .rank{color:var(--muted); font-weight:500; font-size:11.5px}
  .rank b{color:var(--text); font-weight:700}
  .kind{color:var(--muted); font-size:11px; margin-inline-start:auto}
  .card h3{margin:8px 0 3px; font-size:14.5px; font-weight:700; line-height:1.7; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .sub{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:2px 0 5px}
  .creator{color:var(--accent); font-size:12px; direction:ltr; unicode-bidi:isolate}
  .stats{display:flex; gap:10px; color:var(--muted); font-size:12px}
  .stats b{color:var(--text); font-weight:700}
  .summary{font-size:12.5px; line-height:1.9; color:#4a4d55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card.open .summary{-webkit-line-clamp:unset}
  .more{color:var(--accent); font-size:11.5px; cursor:pointer; user-select:none; align-self:flex-start; margin-top:3px}
  .caption{font-size:11.5px; color:var(--muted); border-inline-start:2px solid var(--line); padding:1px 8px; margin:8px 0 0; line-height:1.8; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card.open .caption{-webkit-line-clamp:unset}
  .tags{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0 0}
  .tag{background:var(--chip); color:var(--muted); font-size:10.5px; border-radius:999px; padding:1px 8px}
  .meta{color:var(--muted); font-size:11px; margin-top:8px}
  .openbtn{display:block; text-align:center; margin-top:10px; background:#fff; border:1px solid var(--line); color:var(--accent); font-weight:700; font-size:12.5px; border-radius:9px; padding:7px; text-decoration:none}
  .thumb{display:block; width:100%; height:190px; object-fit:cover; object-position:center 22%; border-radius:9px; margin-bottom:10px; background:var(--chip)}
  .thumbwrap{position:relative; cursor:pointer}
  .thumbwrap .thumb{margin-bottom:10px}
  .playbadge{position:absolute; inset-inline-start:10px; bottom:20px; background:rgba(20,20,25,.78); color:#fff; font-size:12px; font-weight:700; border-radius:999px; padding:5px 12px; pointer-events:none}
  video.thumbvid{display:block; width:100%; height:190px; object-fit:cover; border-radius:9px; margin-bottom:10px; background:#000}
  .card.selected{border-color:var(--accent)}
  .selbtn{display:block; width:100%; margin-top:8px; background:var(--accent); border:1px solid var(--accent); color:#fff; font-weight:700; font-size:12.5px; border-radius:9px; padding:8px; font-family:inherit; cursor:pointer}
  .selbtn.on{background:#fff; color:var(--accent)}
  .selhint{color:var(--muted); font-size:11px; margin-top:6px; line-height:1.8}
  .notice{display:none; margin-top:8px; background:#fef3c7; border:1px solid #f59e0b; color:#92400e; font-size:12px; line-height:1.9; border-radius:9px; padding:8px 10px}
  .notice.show{display:block}
  .notice.always{display:block}
  .dropbtn{display:block; width:100%; margin-top:6px; background:#fff; border:1px solid var(--line); color:var(--muted); font-weight:500; font-size:12.5px; border-radius:9px; padding:8px; font-family:inherit; cursor:pointer}
  a.selbtn, a.dropbtn{text-decoration:none; text-align:center}
  .mech{font-size:12.5px; line-height:1.9; color:#4a4d55; margin-top:6px}
  .mech b{color:var(--accent)}
  .forpage{display:inline-block; background:var(--chip); color:var(--text); font-size:11.5px; font-weight:700; border-radius:999px; padding:2px 10px; margin-top:8px}
  .prog{margin-top:10px; border-top:1px dashed var(--line); padding-top:9px}
  .prog .bar{display:flex; gap:3px}
  .prog .bar i{flex:1; height:5px; border-radius:99px; background:var(--chip)}
  .prog .bar i.done{background:var(--accent)}
  .prog .lbl{font-size:11.5px; color:var(--text); margin-top:6px}
  .prog .lbl b{color:var(--accent)}
  .prog .route{font-size:11.5px; color:var(--muted); margin-top:2px}
  .viewtoggle{display:flex; gap:6px; margin:0 0 12px}
  .viewtoggle button{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:5px 13px; font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer}
  .viewtoggle button.on{border-color:var(--accent); background:var(--accent); color:#fff; font-weight:700}
  .empty{text-align:center; color:var(--muted); padding:44px 10px; font-size:14px; line-height:2}
  footer.note{text-align:center; color:var(--muted); font-size:11px; margin-top:26px; line-height:1.9}
  .loading{text-align:center; color:var(--muted); padding:50px 0}
</style>
</head>
<body>
<div class="topbar">
  <span class="ttl">بانک ایده 🔓</span>
  <span class="cnt" id="liveCount">…</span>
  <button id="filterToggle" aria-expanded="false">فیلترها <span class="fbadge" id="activeBadge"></span><span class="chev">▾</span></button>
  <div class="seg" id="bucketSeg">
    <button data-bucket="shode.dige" class="on">شده دیگه</button>
    <button data-bucket="amirdecodes">AmirDecodes</button>
    <button data-bucket="undecided">نامشخص</button>
    <button data-bucket="suggestions">پیشنهادات میوز</button>
  </div>
</div>

<div class="filters" id="filters" hidden>
  <div class="frow">
    <label>مرتب‌سازی وایرال
      <select id="sortSel">
        <option value="desc">پرلایک‌ترین اول</option>
        <option value="asc">کم‌لایک‌ترین اول</option>
      </select>
    </label>
    <label>حداقل لایک
      <input id="minLikes" type="number" inputmode="numeric" min="0" placeholder="۰">
    </label>
    <label>فرستنده
      <select id="senderSel">
        <option value="">همه</option>
        <option value="امیر">امیر</option>
        <option value="نگین">نگین</option>
      </select>
    </label>
    <label>از تاریخ
      <input id="dateFrom" type="date">
    </label>
    <label>تا تاریخ
      <input id="dateTo" type="date">
    </label>
  </div>
  <button id="resetBtn">پاک‌کردن فیلترها</button>
</div>

<main id="app"><div class="loading">…</div></main>
<footer class="note">قاعدهٔ بانک: مکانیزم هر ایده استخراج می‌شود؛ سطح و متنش کپی نمی‌شود.<br>بخش «نامشخص» منتظر تعیین پیج با دست است.</footer>

<script>
const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#f7f7f5'); } catch(e) {}
}
const faNum = n => Number(n).toLocaleString('fa-IR');
const state = { bucket: 'shode.dige', sort: 'desc', minLikes: 0, sender: '', from: '', to: '', view: 'all' };
let DATA = null;
// Actions (select / promote / drop) are bot deep links: the old WebApp
// data channel never delivered for Amir, so a tap now goes to the bot chat with a
// /start payload; the bot registers the action and announces it in the
// AmirDecodes group together with the production stages.
const BOT_BASE = 'https://t.me/Muse_Amirdecodes_bot?start=';
const START_HINT = 'با زدن دکمه می‌ری به چت بات؛ اونجا Start رو بزن تا انتخابت توی گروه ثبت بشه';
const BUCKET_SUGGEST_FA = { 'AmirDecodes': 'AmirDecodes', 'Shode.dige': 'شده‌دیگه', 'نامشخص': 'نامشخص' };

function passFilters(it) {
  if (it.bucket !== state.bucket) return false;
  if (state.view === 'prod' && it.stage === undefined) return false;
  if (state.minLikes && it.likes < state.minLikes) return false;
  if (state.sender && it.sender !== state.sender) return false;
  const d = (it.sent_iso || '').slice(0, 10);
  if (state.from && d < state.from) return false;
  if (state.to && d > state.to) return false;
  return true;
}

function activeCount() {
  let n = 0;
  if (state.sort !== 'desc') n++;
  if (state.minLikes) n++;
  if (state.sender) n++;
  if (state.from || state.to) n++;
  return n;
}

function cardHTML(it) {
  const tags = it.tags.map(t => `<span class="tag">#${t}</span>`).join('');
  const cap = it.caption ? `<div class="caption">${it.caption}</div>` : '';
  let thumb = '';
  if (it.thumb && it.preview) {
    thumb = `<div class="thumbwrap" data-preview="${it.preview}" data-code="${it.code}"><img class="thumb" src="${it.thumb}" alt="" loading="lazy"><span class="playbadge">▶ پیش‌نمایش</span></div>`;
  } else if (it.thumb) {
    thumb = `<img class="thumb" src="${it.thumb}" alt="" loading="lazy">`;
  }
  const selected = it.stage !== undefined;
  let sel = '';
  if (selected) {
    const stages = DATA.stages || [];
    const bars = stages.map((s, i) => `<i class="${i <= it.stage ? 'done' : ''}"></i>`).join('');
    sel = `<div class="prog">
        <div class="bar">${bars}</div>
        <div class="lbl">🎬 در دست ساخت — مرحلهٔ <b>${faNum(it.stage)}</b> از ${faNum(stages.length - 1)}: ${it.stage_label || ''}</div>
        ${it.route ? `<div class="route">روش ساخت: ${it.route}</div>` : ''}
        ${it.selected_by ? `<div class="route">انتخاب: ${it.selected_by}</div>` : ''}
      </div>
      <a class="selbtn on" href="${BOT_BASE}des_${it.code}">انتخاب شده ✓ — لغو</a>`;
  } else {
    sel = `<a class="selbtn" href="${BOT_BASE}sel_${it.code}">🎬 ثبت انتخاب برای ساخت</a>`;
  }
  sel += `<div class="selhint">${START_HINT}</div>`;
  return `<article class="card${selected ? ' selected' : ''}" data-code="${it.code}">
    ${thumb}
    <div class="row1">
      <span class="code">${it.code}</span>
      <span class="rank">رتبهٔ کلی <b>${faNum(it.rank)}</b></span>
      <span class="kind">${it.kind === 'post' ? 'پست' : 'ریلز'}</span>
    </div>
    <h3>${it.title}</h3>
    <div class="sub">
      <span class="creator">${it.creator}${it.creator_name ? ' (' + it.creator_name + ')' : ''}</span>
      <span class="stats"><span>❤️ <b>${faNum(it.likes)}</b></span><span>💬 <b>${faNum(it.comments)}</b></span></span>
    </div>
    <div class="summary">${it.summary}</div>
    <span class="more">ادامه…</span>
    ${cap}
    <div class="tags">${tags}</div>
    <div class="meta">📤 ${it.sender} — ${it.sent_display} • ${it.source}</div>
    <a class="openbtn" href="${it.url}" target="_blank" rel="noopener">تماشای کامل در اینستاگرام</a>
    ${sel}
  </article>`;
}

function candCardHTML(c) {
  let thumb = '';
  if (c.thumb && c.preview) {
    thumb = `<div class="thumbwrap" data-preview="${c.preview}" data-cand="${c.id}"><img class="thumb" src="${c.thumb}" alt="" loading="lazy"><span class="playbadge">▶ پیش‌نمایش</span></div>`;
  } else if (c.thumb) {
    thumb = `<img class="thumb" src="${c.thumb}" alt="" loading="lazy">`;
  }
  return `<article class="card" data-cand="${c.id}">
    ${thumb}
    <div class="row1">
      <span class="code">${c.id}</span>
      <span class="kind">پیشنهاد میوز</span>
    </div>
    <h3>${c.title || ''}</h3>
    <div class="sub">
      <span class="creator">${c.creator || ''}</span>
      <span class="stats"><span>❤️ <b>${faNum(c.likes || 0)}</b></span><span>💬 <b>${faNum(c.comments || 0)}</b></span></span>
    </div>
    <div class="mech"><b>چرا وایرال شد؟</b> ${c.mechanism_note || ''}</div>
    <span class="forpage">برای پیج: ${BUCKET_SUGGEST_FA[c.bucket_suggestion] || c.bucket_suggestion || ''}</span>
    <a class="openbtn" href="${c.url}" target="_blank" rel="noopener">تماشای کامل در اینستاگرام</a>
    <a class="selbtn" href="${BOT_BASE}pro_${c.id}">✅ بیاد توی لیست اصلی</a>
    <a class="dropbtn" href="${BOT_BASE}dro_${c.id}">✕ نمی‌خوامش</a>
    <div class="selhint">${START_HINT}</div>
  </article>`;
}

function renderSuggestions(app) {
  const cands = DATA.suggestions || [];
  document.getElementById('liveCount').innerHTML =
    `<b>${faNum(cands.length)}</b> پیشنهاد`;
  const badge = document.getElementById('activeBadge');
  badge.style.display = 'none';
  let html = `<section class="bucket"><div class="buckethead">` +
    `<h2>پیشنهادات میوز</h2><span class="n">${faNum(cands.length)} ویدیو</span></div>` +
    `<p class="blurb">ویدیوهای کاملاً وایرالی که میوز روزانه پیدا می‌کنه؛ اگه پسندیدی بفرستش توی لیست اصلی تا برای ساخت انتخاب بشه.</p>`;
  if (!cands.length) {
    html += '<div class="empty">فعلاً پیشنهادی نیست 🌱<br>میوز هر روز می‌گرده و ویدیوهای کاملاً وایرال رو اینجا می‌ذاره.</div>';
  } else {
    html += `<div class="grid">` + cands.map(candCardHTML).join('') + `</div>`;
  }
  html += `</section>`;
  app.innerHTML = html;
}

function render() {
  const app = document.getElementById('app');
  if (state.bucket === 'suggestions') {
    renderSuggestions(app);
    bindCardEvents(app);
    return;
  }
  let items = DATA.items.filter(passFilters);
  if (state.view === 'prod') {
    items.sort((a, b) => (a.stage - b.stage) || (a.rank - b.rank));
  } else {
    items.sort((a, b) => state.sort === 'desc' ? b.likes - a.likes : a.likes - b.likes);
  }
  const bucketTotal = DATA.items.filter(i => i.bucket === state.bucket).length;
  const prodTotal = DATA.items.filter(i => i.bucket === state.bucket && i.stage !== undefined).length;
  document.getElementById('liveCount').innerHTML =
    `نمایش <b>${faNum(items.length)}</b> از ${faNum(bucketTotal)}`;
  const badge = document.getElementById('activeBadge');
  const ac = activeCount();
  badge.style.display = ac ? '' : 'none';
  badge.textContent = faNum(ac);
  const b = DATA.buckets.find(x => x.key === state.bucket);
  const toggle = `<div class="viewtoggle">
      <button data-view="all" class="${state.view === 'all' ? 'on' : ''}">همهٔ این بخش</button>
      <button data-view="prod" class="${state.view === 'prod' ? 'on' : ''}">در دست ساخت (${faNum(prodTotal)})</button>
    </div>`;
  let html = `<section class="bucket"><div class="buckethead">` +
    `<h2>${b ? b.name : ''}</h2><span class="n">${faNum(bucketTotal)} ایده</span></div>` +
    (b && b.blurb ? `<p class="blurb">${b.blurb}</p>` : '') + toggle;
  if (!items.length) {
    html += state.view === 'prod'
      ? '<div class="empty">هنوز چیزی برای ساخت انتخاب نشده 🎬<br>از «همهٔ این بخش» یه ایده رو انتخاب کن.</div>'
      : '<div class="empty">با این فیلترها چیزی نیست 🤷<br>فیلترها رو کمتر کن.</div>';
  } else {
    html += `<div class="grid">` + items.map(cardHTML).join('') + `</div>`;
  }
  html += `</section>`;
  app.innerHTML = html;
  bindCardEvents(app);
}

function bindCardEvents(app) {
  app.querySelectorAll('.viewtoggle button').forEach(btn => {
    btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); });
  });
  app.querySelectorAll('.card .more').forEach(el => {
    el.addEventListener('click', () => {
      const card = el.closest('.card');
      card.classList.toggle('open');
      el.textContent = card.classList.contains('open') ? 'بستن' : 'ادامه…';
    });
  });
  app.querySelectorAll('.openbtn').forEach(a => {
    a.addEventListener('click', e => {
      if (tg) { e.preventDefault(); tg.openLink(a.href); }
    });
  });
  app.querySelectorAll('.thumbwrap').forEach(w => {
    w.addEventListener('click', () => {
      if (w.dataset.loading) return;
      w.dataset.loading = '1';
      const badge = w.querySelector('.playbadge');
      if (badge) badge.textContent = '… در حال بارگذاری';
      const it = DATA.items.find(i => i.code === w.dataset.code) ||
                 (DATA.suggestions || []).find(c => c.id === w.dataset.cand);
      fetch(w.dataset.preview, { cache: 'force-cache' })
        .then(r => r.ok ? r.text() : Promise.reject(new Error('fetch')))
        .then(b64 => {
          const bin = atob(b64.trim());
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const url = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
          const v = document.createElement('video');
          v.className = 'thumbvid';
          v.controls = true; v.playsInline = true; v.preload = 'auto';
          if (it && it.thumb) v.poster = it.thumb;
          v.src = url;
          w.replaceWith(v);
          v.play().catch(() => {});
        })
        .catch(() => {
          delete w.dataset.loading;
          if (badge) badge.textContent = '▶ پیش‌نمایش (تلاش دوباره)';
        });
    });
  });
}

function bindFilters() {
  const panel = document.getElementById('filters');
  const toggle = document.getElementById('filterToggle');
  toggle.addEventListener('click', () => {
    const open = panel.hidden;
    panel.hidden = !open;
    toggle.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.querySelectorAll('#bucketSeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#bucketSeg button').forEach(x => x.classList.remove('on'));
      btn.classList.add('on');
      state.bucket = btn.dataset.bucket;
      render();
    });
  });
  document.getElementById('sortSel').addEventListener('change', e => { state.sort = e.target.value; render(); });
  document.getElementById('minLikes').addEventListener('input', e => { state.minLikes = parseInt(e.target.value, 10) || 0; render(); });
  document.getElementById('senderSel').addEventListener('change', e => { state.sender = e.target.value; render(); });
  document.getElementById('dateFrom').addEventListener('change', e => { state.from = e.target.value; render(); });
  document.getElementById('dateTo').addEventListener('change', e => { state.to = e.target.value; render(); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    state.sort = 'desc'; state.minLikes = 0; state.sender = ''; state.from = ''; state.to = '';
    document.getElementById('sortSel').value = 'desc';
    document.getElementById('minLikes').value = '';
    document.getElementById('senderSel').value = '';
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    render();
  });
}

fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d) { document.getElementById('app').innerHTML = '<div class="empty">خطا در بارگذاری بانک ⚠️</div>'; return; }
    DATA = d;
    bindFilters(); render();
  })
  .catch(() => { document.getElementById('app').innerHTML = '<div class="empty">خطا در بارگذاری بانک ⚠️</div>'; });
</script>
